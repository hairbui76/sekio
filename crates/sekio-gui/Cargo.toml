[package]
name = "sekio-gui"
version.workspace = true
edition.workspace = true
license.workspace = true

# The GUI is a library with a thin binary on top purely so `tests/` can link
# against it: `cargo test` cannot reach inside a bin-only crate, which is how a
# fully implemented egui UI ended up with no rendering test at all.
[lib]
name = "sekio_gui"
path = "src/lib.rs"

[[bin]]
name = "sekio-gui"
path = "src/main.rs"

[dev-dependencies]
# Headless egui: drives a real `egui::Context` through AccessKit and hands back
# the frame's shapes, so the UI can be rendered and asserted on with no display
# server. Default features only: `wgpu`/`snapshot` would make `cargo test`
# depend on a working GPU adapter, which the CI test job installs nothing for,
# and would compare pixels across two different software rasterisers on the two
# runners. See the module docs in tests/render.rs. Dev-only: it must never
# reach the shipped binary (`cargo tree -p sekio-gui -e normal`).
egui_kittest = { version = "0.35", default-features = false }
# Only to build a real .xlsx in-memory for the width tests, so the "a wider
# window lays the table out wider" assertion runs through core's actual
# spreadsheet renderer rather than a hand-made stand-in — and so no binary
# fixture lands in the repo. Dev-only, and already in this workspace's
# lockfile via sekio-core.
zip = { workspace = true }

[dependencies]
sekio-core = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
image = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
# Global hotkey registration. Cross-platform (Win32 RegisterHotKey / X11
# XGrabKey) behind one API, so the daemon can be summoned from anywhere.
global-hotkey = "0.8"
rfd = { workspace = true }

# Unix only, and only for the single-instance daemon: `std` cannot install a
# signal handler at all, so this is what lets SIGTERM/SIGINT unlink the socket
# instead of leaving a stale one behind. Pure Rust over `libc` (no C toolchain,
# so Windows builds are untouched — it is not even in their dependency graph),
# and already in this workspace's lockfile via crossterm.
[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

# Two Windows-only jobs. Reading the file manager's current selection: on
# Windows that is a COM call into Explorer, while on Linux there is no
# universal API, so the fallbacks live behind the same trait (see
# src/selection/). And reattaching a windowed binary to the console that
# launched it, so `--doctor` still prints (see src/console.rs).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    # HANDLE itself, and GetHandleInformation — which is how a standard handle
    # that was never set up is told from one the shell redirected.
    "Win32_Foundation",
    "Win32_System_Com",
    # AttachConsole/GetStdHandle/SetStdHandle: what lets a windows-subsystem
    # binary print to the terminal that launched it instead of nowhere at all.
    "Win32_System_Console",
    # IShellBrowser, IFolderView2 and VARIANT itself are all gated behind this;
    # without it there is no path from a window handle to a shell selection.
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
