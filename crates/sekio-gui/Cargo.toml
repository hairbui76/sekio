[package]
name = "sekio-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
# Embeds the icon resource into sekio-gui.exe. A no-op on every non-Windows
# host, including the `--target x86_64-pc-windows-msvc` cross-check; build.rs
# explains why the gate is on the host and not the target.
build = "build.rs"

# The GUI is a library with a thin binary on top purely so `tests/` can link
# against it: `cargo test` cannot reach inside a bin-only crate, which is how a
# fully implemented egui UI ended up with no rendering test at all.
[lib]
name = "sekio_gui"
path = "src/lib.rs"

[[bin]]
name = "sekio-gui"
path = "src/main.rs"

[dev-dependencies]
# Headless egui: drives a real `egui::Context` through AccessKit and hands back
# the frame's shapes, so the UI can be rendered and asserted on with no display
# server. Default features only: `wgpu`/`snapshot` would make `cargo test`
# depend on a working GPU adapter, which the CI test job installs nothing for,
# and would compare pixels across two different software rasterisers on the two
# runners. See the module docs in tests/render.rs. Dev-only: it must never
# reach the shipped binary (`cargo tree -p sekio-gui -e normal`).
egui_kittest = { version = "0.35", default-features = false }
# Only to build a real .xlsx in-memory for the one end-to-end table test, so
# "every cell arrives whole and is painted whole" runs through core's actual
# spreadsheet renderer rather than a hand-made stand-in — and so no binary
# fixture lands in the repo. Every other table test builds the `Table` IR
# directly, because that IR is the contract this crate paints. Dev-only, and
# already in this workspace's lockfile via sekio-core.
zip = { workspace = true }

[dependencies]
sekio-core = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
image = { workspace = true }
eframe = { workspace = true }
egui = { workspace = true }
# Global hotkey registration. Cross-platform (Win32 RegisterHotKey / X11
# XGrabKey) behind one API, so the daemon can be summoned from anywhere.
global-hotkey = "0.8"
rfd = { workspace = true }
# The config file. Same pair, same versions and same reasoning as
# `sekio-tui`: both are pure Rust, so the no-C-toolchain rule holds, and the
# GUI needs a *writable* config because the tray persists a hotkey change
# through it.
serde = { version = "1", features = ["derive"] }
toml = "1"

# Unix only, and only for the single-instance daemon: `std` cannot install a
# signal handler at all, so this is what lets SIGTERM/SIGINT unlink the socket
# instead of leaving a stale one behind. Pure Rust over `libc` (no C toolchain,
# so Windows builds are untouched — it is not even in their dependency graph),
# and already in this workspace's lockfile via crossterm.
[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"
# The Linux tray, as StatusNotifierItem over D-Bus. Pure Rust on purpose:
# tray-icon reaches the tray through libappindicator via GTK, and a C
# dependency would break the rule that keeps the Windows cross-check working.
# `blocking`: a pure code gate (ksni declares it `blocking = []`, so the
# lockfile is bit-identical with and without it), and the only usable shape
# here. The default `tokio` feature leaves `TrayMethods::spawn` async with a
# `tokio::spawn` inside, which panics outside a runtime — and sekio-gui has no
# tokio dependency to give it one.
ksni = { version = "0.3", features = ["blocking"] }

# The Windows icon resource, and nothing else. Under `[target.'cfg(windows)']`
# rather than a plain `[build-dependencies]` because for *build* dependencies
# cargo matches that cfg against the **host**, which is the same question
# `#[cfg(windows)]` inside build.rs asks — so the crate and the code that uses
# it can never disagree about whether they exist. Verify with:
#
#   cargo tree -p sekio-gui -e build                          # empty on Linux
#   cargo tree -p sekio-gui -e build --target x86_64-pc-windows-msvc  # also empty
#   cargo tree -p sekio-gui -e build --target all             # shows winresource
#
# It is still resolved into Cargo.lock and may be downloaded on any host, as
# every platform-specific dependency is; it is simply never compiled or linked
# on a non-Windows host, which is what keeps the Linux build and the
# `--target x86_64-pc-windows-msvc` cross-check untouched.
[target.'cfg(windows)'.build-dependencies]
# The maintained fork of `winres` (which is unmaintained). Pure Rust — it pulls
# only `toml` and `version_check`, both already in this lockfile, and shells out
# to the Windows SDK's rc.exe rather than linking anything, so it does not
# breach this workspace's no-C-dependency rule. See CLAUDE.md.
winresource = "0.1"

# Two Windows-only jobs. Reading the file manager's current selection: on
# Windows that is a COM call into Explorer, while on Linux there is no
# universal API, so the fallbacks live behind the same trait (see
# src/selection/). And reattaching a windowed binary to the console that
# launched it, so `--doctor` still prints (see src/console.rs).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    # HANDLE itself, and GetHandleInformation — which is how a standard handle
    # that was never set up is told from one the shell redirected.
    "Win32_Foundation",
    "Win32_System_Com",
    # AttachConsole/GetStdHandle/SetStdHandle: what lets a windows-subsystem
    # binary print to the terminal that launched it instead of nowhere at all.
    "Win32_System_Console",
    # IShellBrowser, IFolderView2 and VARIANT itself are all gated behind this;
    # without it there is no path from a window handle to a shell selection.
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    # ConvertStringSecurityDescriptorToSecurityDescriptorW / ConvertSidToStringSidW:
    # the daemon's named pipe is created with an SDDL DACL naming the current
    # user's SID, which is what keeps another account off it.
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    # GetModuleHandleW, for the tray's window class. One call, but a declared
    # feature beats a hand-written `link!` import: this is the binding the
    # crate is built to hand out, and features here are pure cfg gates over
    # pre-generated code — the lockfile does not move.
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    # ReadFile/WriteFile/ConnectNamedPipe are all gated behind this: their
    # signatures name OVERLAPPED even when, as here, it is always NULL.
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
