[package]
name = "sekio-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Pure-Rust formats are on by default: no C toolchain, so Windows builds stay
# painless (see CLAUDE.md).
default = ["archive", "markdown", "svg", "audio", "exif", "office", "pdf"]
archive = ["dep:zip", "dep:tar", "dep:flate2"]
markdown = ["dep:comrak"]
svg = ["dep:resvg"]
audio = ["dep:symphonia"]
exif = ["dep:kamadak-exif"]
# Office documents: OOXML (docx/pptx) and spreadsheets (xls/xlsx/xlsb/ods).
office = ["dep:calamine", "dep:quick-xml", "dep:zip"]
# PDF text, on by default: `pdf-extract` is pure Rust (lopdf underneath, no C
# `-sys` crate), so it costs nothing at build time and PDFs — one of the most
# common things anyone quick-looks — preview out of the box.
pdf = ["dep:pdf-extract"]
# PDF page image. Not a default, because pdfium is a native library `cargo
# install` cannot provide and a source build must not require — with it compiled
# in but pdfium missing at runtime the renderer falls through to `pdf`'s text.
#
# It is on in every *package*, though: the .deb/.rpm/.msi are built with it and
# ship a copy of pdfium beside the binaries, which is what render/pdf.rs's
# bundled-library lookup finds. A scanned PDF has no text layer to fall back to,
# so for that file the page image is the only preview there is. See
# packaging/README.md.
pdf-render = ["dep:pdfium-render"]
# Heavy / external-dependency formats, opt-in.
video = []
# Legacy binary Office (.doc/.ppt) by shelling out to LibreOffice — no Rust
# dependency of its own, which is why there is no `dep:` here. Off by default
# because it needs LibreOffice installed, exactly as `video` needs ffmpeg; with
# it missing at runtime the renderer degrades to a `Metadata` preview.
# It turns `office` on because a converted `.ppt` is read back through the OOXML
# reader in `render/document.rs` (Impress has no plain-text export filter).
office-legacy = ["office"]

[dependencies]
thiserror = { workspace = true }
infer = { workspace = true }
image = { workspace = true }
syntect = { workspace = true }
chardetng = { workspace = true }
encoding_rs = { workspace = true }

zip = { workspace = true, optional = true }
tar = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
comrak = { workspace = true, optional = true }
resvg = { workspace = true, optional = true }
symphonia = { workspace = true, optional = true }
kamadak-exif = { workspace = true, optional = true }
calamine = { workspace = true, optional = true }
quick-xml = { workspace = true, optional = true }
pdfium-render = { workspace = true, optional = true }
# Pure Rust (lopdf underneath): no C `-sys` crate, so the Windows/cross builds
# stay painless. Not in [workspace.dependencies] because sekio-core is the only
# crate that touches it.
pdf-extract = { version = "0.12", optional = true }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-default-fancy"] }
