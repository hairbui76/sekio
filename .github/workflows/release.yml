name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# The pdfium build the packages vendor, pinned to one upstream release.
#
# pdfium is a dlopen'd native library that neither Debian nor Fedora package and
# Windows has no package manager for, so "install pdfium yourself" is not an
# instruction anyone who installed a .deb/.rpm/.msi can follow. Without it a
# scanned PDF - images all the way down, no text layer to fall back to - has no
# preview at all. So a copy ships inside each package.
#
# Pinned to a tag, never `latest`: re-running this workflow on an older tag must
# produce the same installer, and upstream cuts a release most weeks. The
# checksums are the pin that actually bites, since a tag can be moved.
# packaging/README.md documents how to bump all four values together.
env:
  PDFIUM_TAG: chromium/8009
  PDFIUM_SHA256_LINUX: be513e8021a5bf8eb2116e00d78c3bacb82c5a02b3785156ae14fe5e33084385
  PDFIUM_SHA256_WINDOWS: c78a8cd51b48abafcb266d868e401afefda1d189aa01ebbe743dc1d144e06031

jobs:
  linux-packages:
    name: deb + rpm (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install GUI build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev

      - name: Install cargo-deb and cargo-generate-rpm
        run: cargo install cargo-deb cargo-generate-rpm --locked

      # The tarball is a whole SDK (headers, cmake config, static import libs);
      # only the shared library and pdfium's own license go into the packages.
      # Both are listed in the `assets` tables in crates/sekio-cli/Cargo.toml,
      # which resolve them from this directory.
      - name: Fetch pdfium (linux-x64)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packaging/vendor/pdfium
          cd packaging/vendor
          curl -fsSL -o pdfium.tgz \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/$PDFIUM_TAG/pdfium-linux-x64.tgz"
          echo "$PDFIUM_SHA256_LINUX  pdfium.tgz" | sha256sum -c -
          tar -xzf pdfium.tgz -C pdfium --strip-components=1 lib/libpdfium.so licenses/pdfium.txt
          rm pdfium.tgz
          mv pdfium/pdfium.txt pdfium/LICENSE-pdfium.txt
          # A shared library is data, not a program: 644, or lintian complains.
          chmod 644 pdfium/libpdfium.so pdfium/LICENSE-pdfium.txt
          ls -l pdfium

      # Both packagers run with --no-build against these artifacts, so all
      # three binaries have to exist before either one runs.
      #
      # `sekio-core/pdf-render` is on here and not in the crate's default
      # features on purpose: it is what turns the pdfium fetched above into a
      # rendered page, and a `cargo install` build - which has no bundled
      # library - must still get the text/metadata fallback rather than a
      # dependency it cannot satisfy.
      - name: Build binaries
        run: |
          cargo build --release \
            --features sekio-core/video,sekio-core/pdf-render \
            -p sekio-cli -p sekio-tui -p sekio-gui

      # --no-strip because [profile.release] already sets strip = true.
      - name: Build .deb
        run: cargo deb -p sekio-cli --no-build --no-strip

      - name: Build .rpm
        run: cargo generate-rpm -p crates/sekio-cli

      - name: Collect and checksum
        shell: bash
        run: |
          shopt -s nullglob
          mv target/debian/*.deb target/generate-rpm/*.rpm .
          for f in *.deb *.rpm; do
            sha256sum "$f" | awk '{print $1}' > "$f.sha256"
          done
          ls -l -- *.deb *.rpm *.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: sekio-linux-packages
          path: |
            *.deb
            *.rpm
            *.deb.sha256
            *.rpm.sha256

  # Windows installer. This job is the only place the WiX source is actually
  # compiled — WiX v3 is Windows-only, so packaging/wix/main.wxs cannot be
  # validated on a Linux dev machine beyond XML/schema checks. Run this
  # workflow via workflow_dispatch to exercise it without cutting a release.
  msi:
    name: msi (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # cargo-wix 0.3.x drives candle.exe and light.exe, which are WiX Toolset
      # *v3*. Do not swap this for `dotnet tool install --global wix`: that
      # installs WiX v4/v5, whose single `wix build` CLI cargo-wix cannot call.
      - name: Install WiX Toolset v3
        shell: pwsh
        run: |
          choco install wixtoolset --no-progress -y
          # Find candle.exe rather than hardcoding a version directory: the
          # runner image sometimes ships its own WiX 3.x, and the choco package
          # version moves. Chocolatey sets the machine-level WIX variable, which
          # this process cannot see without a shell restart, so search instead.
          $candle = Get-ChildItem `
            -Path "C:\Program Files (x86)\WiX Toolset*\bin\candle.exe", `
                  "C:\Program Files\WiX Toolset*\bin\candle.exe" `
            -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $candle) { throw "candle.exe not found after installing WiX Toolset v3" }
          Write-Host "Using WiX bin: $($candle.DirectoryName)"
          $candle.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Install cargo-wix
        run: cargo install cargo-wix --locked

      # Same vendored pdfium as the Linux packages, from the same pinned tag.
      # packaging/wix/main.wxs installs pdfium.dll into the bin directory beside
      # the three exes, which is where the loader and sekio itself look first.
      # bash, not pwsh: the runner has git bash, curl, tar and sha256sum, so
      # this step reads identically to its Linux twin above.
      - name: Fetch pdfium (win-x64)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packaging/vendor/pdfium
          # Relative paths throughout: $RUNNER_TEMP on this runner is a
          # backslash path, which git bash's coreutils only mostly agree about.
          cd packaging/vendor
          curl -fsSL -o pdfium.tgz \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/$PDFIUM_TAG/pdfium-win-x64.tgz"
          echo "$PDFIUM_SHA256_WINDOWS  pdfium.tgz" | sha256sum -c -
          tar -xzf pdfium.tgz -C pdfium --strip-components=1 bin/pdfium.dll licenses/pdfium.txt
          rm pdfium.tgz
          mv pdfium/pdfium.txt pdfium/LICENSE-pdfium.txt
          ls -l pdfium

      # The .wxs pulls in all three exes, and [package.metadata.wix] sets
      # no-build, so they must be built before cargo-wix runs.
      #
      # `sekio-core/pdf-render` matches the .deb/.rpm: the installer ships
      # pdfium.dll, so the renderer it compiles in has a library to bind to.
      # `video` stays off - Windows has no package manager dependency to pull
      # ffmpeg in with, and unlike pdfium ffmpeg is not ours to vendor.
      - name: Build binaries
        run: >-
          cargo build --release --features sekio-core/pdf-render
          -p sekio-cli -p sekio-tui -p sekio-gui

      # --nocapture so candle/light diagnostics land in the job log; without it
      # a WiX error surfaces only as an exit code.
      - name: Build .msi
        run: cargo wix -p sekio-cli --no-build --nocapture

      - name: Collect and checksum
        shell: bash
        run: |
          # cargo-wix names it sekio-<version>-x86_64.msi; rename to match the
          # sibling archive naming used by the rest of this release.
          mv target/wix/*.msi sekio-x86_64-pc-windows-msvc.msi
          sha256sum sekio-x86_64-pc-windows-msvc.msi | awk '{print $1}' \
            > sekio-x86_64-pc-windows-msvc.msi.sha256
          ls -l sekio-x86_64-pc-windows-msvc.msi*

      - uses: actions/upload-artifact@v4
        with:
          name: sekio-msi
          path: sekio-x86_64-pc-windows-msvc.msi*

  release:
    needs: [linux-packages, msi]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          # The .deb keeps dpkg's canonical sekio_<version>-1_amd64.deb name,
          # which uses an underscore — hence `sekio*` rather than `sekio-*` on
          # the package and checksum lines. `sekio*.sha256` is a superset of the
          # previous `sekio-*.sha256`, so the archive checksums still publish
          # exactly as before.
          files: |
            sekio*.deb
            sekio*.rpm
            sekio*.msi
            sekio*.sha256
          generate_release_notes: true
